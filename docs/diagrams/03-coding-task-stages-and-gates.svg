318],[790,318]]" d="M740 318 L782 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[990,318],[1040,318]]" d="M990 318 L1032 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><g data-box="code"><rect x="1330" y="287" width="190" height="62" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="1425" y="327.0" font-size="25" font-weight="700" fill="#1E3A8A" text-anchor="middle">safety-net</text></g><g data-box="enforce"><rect x="1570" y="287" width="210" height="62" rx="31" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1675" y="327.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">G:task-end</text></g><path data-arrow="[[1240,212],[1285,212],[1285,318],[1330,318]]" d="M1240 212 L1273 212 Q1285 212 1285 224 L1285 306 Q1285 318 1297 318 L1322 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1240,318],[1330,318]]" d="M1240 318 L1322 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1240,424],[1285,424],[1285,318],[1330,318]]" d="M1240 424 L1273 424 Q1285 424 1285 412 L1285 330 Q1285 318 1297 318 L1322 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1520,318],[1570,318]]" d="M1520 318 L1562 318" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="80" y="565" font-size="26" font-weight="700" fill="#475569" text-anchor="start">End of a publish unit</text><g data-box="code"><rect x="400" y="525" width="190" height="62" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="495" y="565.0" font-size="25" font-weight="700" fill="#1E3A8A" text-anchor="middle">pr-draft</text></g><g data-box="enforce"><rect x="640" y="525" width="200" height="62" rx="31" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="740" y="565.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">G:publish</text></g><g data-box="code"><rect x="890" y="525" width="380" height="62" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="1080" y="565.0" font-size="25" font-weight="700" fill="#1E3A8A" text-anchor="middle">publish: draft PR under auto</text></g><g data-box="enforce"><rect x="1320" y="525" width="220" height="62" rx="31" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1430" y="565.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">G:next-unit</text></g><path data-arrow="[[590,556],[640,556]]" d="M590 556 L632 556" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[840,556],[890,556]]" d="M840 556 L882 556" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1270,556],[1320,556]]" d="M1270 556 L1312 556" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1675,349],[1675,494],[495,494],[495,525]]" d="M1675 349 L1675 482 Q1675 494 1663 494 L507 494 Q495 494 495 506 L495 517" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1475" y="482" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">when the unit’s tasks are done</text><g data-box="human"><rect x="80" y="622" width="430" height="328" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="100" y="685.8" font-size="30" font-weight="700" fill="#78350F" text-anchor="start">Any other mode</text><text x="100" y="738.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">Asks at every gate:</text><text x="100" y="790.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">approve, redo or stop.</text><text x="100" y="842.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">A model never approves.</text></g><g data-box="code"><rect x="540" y="622" width="560" height="328" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="560" y="685.8" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="start">Auto mode</text><text x="560" y="738.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">continue gates pass when</text><text x="560" y="790.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">evidence is complete</text><text x="560" y="842.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">G:type: only if classified certain</text><text x="560" y="894.1" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">G:iterate (design-ux): always asks</text></g><rect x="1130" y="622" width="710" height="328" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1150" y="686" font-size="30" font-weight="700" fill="#881337" text-anchor="start">Always stops and asks, any gate</text><text x="1150" y="740" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">decide finding</text><text x="1150" y="784" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">non-null ambiguity</text><text x="1150" y="828" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">coverage gaps</text><text x="1150" y="872" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">exhausted retries</text><text x="1150" y="916" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">uncovered lens</text><text x="1460" y="740" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">high severity past cap</text><text x="1460" y="784" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">config hash change</text><text x="1460" y="828" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">failed publish</text><text x="1460" y="872" font-size="28" font-weight="400" fill="#0F172A" text-anchor="start">a stop</text><g data-legend="1"><rect x="80" y="985" width="30" height="30" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="120" y="1009" font-size="24" fill="#0F172A">Stage: one Workflow</text></g><g data-legend="1"><rect x="376.6" y="985" width="30" height="30" rx="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="416.6" y="1009" font-size="24" fill="#0F172A">Gate between stages</text></g><g data-legend="1"><rect x="673.2" y="985" width="30" height="30" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="713.2" y="1009" font-size="24" fill="#0F172A">Human</text></g><text x="80" y="1055" font-size="23" fill="#475569">Target design: no stage or gate is built yet. Spike, plan and design-ux have their own paths.</text></svg>
