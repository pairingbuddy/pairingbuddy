<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="h475569" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="hB45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text data-title="1" x="80" y="96" font-size="46" font-weight="700" fill="#0F172A">Hooks and the CLI enforce, models do the work, the mod only watches</text><g data-box="human"><rect x="80" y="240" width="190" height="150" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="175" y="292.4" font-size="26" font-weight="700" fill="#78350F" text-anchor="middle">Human</text><text x="175" y="324.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">approves at</text><text x="175" y="356.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">gates</text></g><g data-box="state"><rect x="342" y="240" width="310" height="150" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="497" y="292.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">Thin commands</text><text x="497" y="324.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">/code  /plan</text><text x="497" y="356.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">/design-ux</text></g><g data-box="model"><rect x="724" y="240" width="290" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="869" y="292.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">Main context</text><text x="869" y="324.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">runs the stage</text><text x="869" y="356.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">loop and gates</text></g><g data-box="code"><rect x="1086" y="240" width="300" height="150" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="1236" y="292.4" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle">Workflow stage</text><text x="1236" y="324.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">workflows/*.js</text><text x="1236" y="356.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">script owns the order</text></g><g data-box="model"><rect x="1458" y="240" width="382" height="150" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1649" y="292.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">Agents</text><text x="1649" y="324.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">do the work, return JSON</text><text x="1649" y="356.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">lens, refuter: read-only</text></g><path data-arrow="[[270,315],[342,315]]" d="M270 315 L334 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[652,315],[724,315]]" d="M652 315 L716 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1014,315],[1086,315]]" d="M1014 315 L1078 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1386,315],[1458,315]]" d="M1386 315 L1450 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[869,240],[869,180],[175,180],[175,240]]" d="M869 240 L869 192 Q869 180 857 180 L187 180 Q175 180 175 192 L175 232" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#hB45309)"/><text x="520" y="166" font-size="24" font-weight="700" fill="#78350F" text-anchor="middle">gate question: approve, redo, stop</text><g data-box="enforce"><rect x="724" y="480" width="662" height="140" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1055" y="527.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">hooks/gate.mjs  (PreToolUse)</text><text x="1055" y="559.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">Enforces: stage order, git push, run-state edits</text><text x="1055" y="591.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">Denies when run state exists and the hook errors</text></g><g data-box="observe"><rect x="1458" y="480" width="382" height="140" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/><text x="1649" y="527.4" font-size="26" font-weight="700" fill="#134E4A" text-anchor="middle">hooks/tap.mjs  (PostToolUse)</text><text x="1649" y="559.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">Observes: captures agent</text><text x="1649" y="591.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">returns and gate answers</text></g><path data-arrow="[[869,390],[869,480]]" d="M869 390 L869 472" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="885" y="446" font-size="24" font-weight="400" fill="#475569" text-anchor="start">every tool call</text><path data-arrow="[[1500,390],[1500,436],[1320,436],[1320,480]]" d="M1500 390 L1500 424 Q1500 436 1488 436 L1332 436 Q1320 436 1320 448 L1320 472" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1410" y="424" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">tool calls</text><path data-arrow="[[1700,390],[1700,480]]" d="M1700 390 L1700 472" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1716" y="446" font-size="24" font-weight="400" fill="#475569" text-anchor="start">returns</text><g data-box="enforce"><rect x="724" y="720" width="380" height="150" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="914" y="772.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">cli/pb.mjs</text><text x="914" y="804.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">Enforces: refuses without</text><text x="914" y="836.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">evidence; only publish route</text></g><g data-box="state"><rect x="1200" y="720" width="340" height="150" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1370" y="772.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">.pairingbuddy/run/</text><text x="1370" y="804.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">ledger, artifacts,</text><text x="1370" y="836.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">unit, report</text></g><g data-box="observe"><rect x="1610" y="720" width="230" height="150" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/><text x="1725" y="772.4" font-size="26" font-weight="700" fill="#134E4A" text-anchor="middle">mod/</text><text x="1725" y="804.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">Observes:</text><text x="1725" y="836.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">pane and sound</text></g><path data-arrow="[[914,620],[914,720]]" d="M914 620 L914 712" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="930" y="676" font-size="24" font-weight="400" fill="#475569" text-anchor="start">allowed verbs only</text><path data-arrow="[[1104,795],[1200,795]]" d="M1104 795 L1192 795" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1152" y="780" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">writes</text><path data-arrow="[[1490,620],[1490,720]]" d="M1490 620 L1490 712" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1506" y="676" font-size="24" font-weight="400" fill="#475569" text-anchor="start">writes artifacts</text><path data-arrow="[[1540,795],[1610,795]]" d="M1540 795 L1602 795" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1575" y="780" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">polls</text><path data-arrow="[[175,390],[175,795],[724,795]]" d="M175 390 L175 783 Q175 795 187 795 L716 795" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#hB45309)"/><text x="200" y="780" font-size="24" font-weight="700" fill="#78350F" text-anchor="start">typed !pb human: hooks deny it to models</text><rect x="210" y="488" width="6" height="124" fill="#BE123C"/><text x="236" y="532" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">Break the mod and</text><text x="236" y="576" font-size="32" font-weight="700" fill="#0F172A" text-anchor="start">enforcement still holds.</text><g data-legend="1"><rect x="80" y="985" width="30" height="30" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="120" y="1009" font-size="24" fill="#0F172A">Human</text></g><g data-legend="1"><rect x="217" y="985" width="30" height="30" rx="7" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="257" y="1009" font-size="24" fill="#0F172A">Model</text></g><g data-legend="1"><rect x="354" y="985" width="30" height="30" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="394" y="1009" font-size="24" fill="#0F172A">Deterministic code</text></g><g data-legend="1"><rect x="639.2" y="985" width="30" height="30" rx="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="679.2" y="1009" font-size="24" fill="#0F172A">Enforces: can refuse</text></g><g data-legend="1"><rect x="947.2" y="985" width="30" height="30" rx="7" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/><text x="987.2" y="1009" font-size="24" fill="#0F172A">Observes: never blocks</text></g><g data-legend="1"><rect x="1278" y="985" width="30" height="30" rx="7" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1318" y="1009" font-size="24" fill="#0F172A">Files and state</text></g><text x="80" y="1055" font-size="23" fill="#475569">Target design from the plan; gate.mjs, tap.mjs and the mod are not built yet. Built: bundler, drift check, harness, pytest wrapper. In progress: ledger, keys, labels, pb run open.</text></svg>
