<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="h475569" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text data-title="1" x="80" y="96" font-size="46" font-weight="700" fill="#0F172A">Each test earns its commits: evidence comes from pb, not the model’s word</text><rect data-panel="1" x="80" y="160" width="540" height="500" rx="18" fill="#F8FAFC" stroke="none"/><text x="104" y="202" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">RED</text><rect data-panel="1" x="660" y="160" width="540" height="500" rx="18" fill="#F8FAFC" stroke="none"/><text x="684" y="202" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">GREEN</text><rect data-panel="1" x="1240" y="160" width="600" height="500" rx="18" fill="#F8FAFC" stroke="none"/><text x="1264" y="202" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">REFACTOR</text><g data-box="model"><rect x="120" y="225" width="460" height="100" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="350" y="268.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">implement-tests</text><text x="350" y="300.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">writes one failing test</text></g><g data-box="model"><rect x="700" y="225" width="460" height="100" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="930" y="268.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">implement-code</text><text x="930" y="300.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">minimal code to pass</text></g><g data-box="model"><rect x="1264" y="225" width="262" height="100" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1395" y="268.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">Light review</text><text x="1395" y="300.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">0-2 lenses</text></g><g data-box="model"><rect x="1554" y="225" width="262" height="100" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1685" y="268.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">refactor-*</text><text x="1685" y="300.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">acts on findings</text></g><g data-box="enforce"><rect x="120" y="375" width="460" height="130" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="350" y="417.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">pb checkpoint --step red</text><text x="350" y="449.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">counts only exit 1 (configurable)</text><text x="350" y="481.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">exit 5, no tests, is not RED</text></g><g data-box="enforce"><rect x="700" y="375" width="460" height="130" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="930" y="417.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">pb checkpoint --step green</text><text x="930" y="449.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">exit 0 on the selected tests</text><text x="930" y="481.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">selectors from the artifact only</text></g><g data-box="enforce"><rect x="1320" y="375" width="496" height="130" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1568" y="417.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">pb checkpoint --step refactor</text><text x="1568" y="449.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">CLI runs the tests, records the exit</text><text x="1568" y="481.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">no change makes no commit</text></g><g data-box="state"><rect x="120" y="555" width="460" height="76" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="350" y="602.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">test commit</text></g><g data-box="state"><rect x="700" y="555" width="460" height="76" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="930" y="602.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">feat or fix commit</text></g><g data-box="state"><rect x="1320" y="555" width="496" height="76" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1568" y="602.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">refactor commit, per fix group</text></g><path data-arrow="[[350,325],[350,375]]" d="M350 325 L350 367" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[350,505],[350,555]]" d="M350 505 L350 547" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[930,325],[930,375]]" d="M930 325 L930 367" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[930,505],[930,555]]" d="M930 505 L930 547" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1526,275],[1554,275]]" d="M1526 275 L1546 275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1685,325],[1685,375]]" d="M1685 325 L1685 367" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1568,505],[1568,555]]" d="M1568 505 L1568 547" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[580,593],[640,593],[640,275],[700,275]]" d="M580 593 L628 593 Q640 593 640 581 L640 287 Q640 275 652 275 L692 275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1160,593],[1220,593],[1220,275],[1264,275]]" d="M1160 593 L1208 593 Q1220 593 1220 581 L1220 287 Q1220 275 1232 275 L1256 275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1568,631],[1568,684],[60,684],[60,275],[120,275]]" d="M1568 631 L1568 672 Q1568 684 1556 684 L72 684 Q60 684 60 672 L60 287 Q60 275 72 275 L112 275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="820" y="674" font-size="24" font-weight="700" fill="#475569" text-anchor="middle">next test</text><text x="1840" y="726" font-size="24" font-weight="400" fill="#475569" text-anchor="end">pb test runs the human-owned command with no shell; pb checkpoint commits only on the right exit code</text><text x="80" y="726" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">Where lenses run</text><g data-box="model"><rect x="80" y="750" width="420" height="170" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="290" y="811.1" font-size="28" font-weight="700" fill="#4C1D95" text-anchor="middle">Before tdd: scenarios</text><text x="290" y="845.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">4 lenses, refuters</text><text x="290" y="879.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">capped at 6</text></g><g data-box="state"><rect x="526.6" y="750" width="420" height="170" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="736.6" y="811.1" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">RED and GREEN</text><text x="736.6" y="845.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">no lenses</text><text x="736.6" y="879.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">the test exit code decides</text></g><g data-box="model"><rect x="973.2" y="750" width="420" height="170" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1183.2" y="811.1" font-size="28" font-weight="700" fill="#4C1D95" text-anchor="middle">Green to refactor</text><text x="1183.2" y="845.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">0-2 lenses, no refuters</text><text x="1183.2" y="879.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">triage picks by need</text></g><g data-box="model"><rect x="1419.8000000000002" y="750" width="420" height="170" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1629.8000000000002" y="811.1" font-size="28" font-weight="700" fill="#4C1D95" text-anchor="middle">After tdd: safety-net</text><text x="1629.8000000000002" y="845.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">3 lenses, refuters</text><text x="1629.8000000000002" y="879.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">capped at 6, 2 fix rounds</text></g><g data-legend="1"><rect x="80" y="985" width="30" height="30" rx="7" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="120" y="1009" font-size="24" fill="#0F172A">Model</text></g><g data-legend="1"><rect x="217" y="985" width="30" height="30" rx="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="257" y="1009" font-size="24" fill="#0F172A">Enforces: can refuse</text></g><g data-legend="1"><rect x="525" y="985" width="30" height="30" rx="7" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="565" y="1009" font-size="24" fill="#0F172A">Files and state</text></g><text x="80" y="1055" font-size="23" fill="#475569">Planned at T2 and T5b (identify-* stand in before T5b). create-test-placeholders runs first; verify-test-coverage after.</text></svg>
