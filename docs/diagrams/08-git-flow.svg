<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="h475569" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="h334155" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="hB45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text data-title="1" x="80" y="96" font-size="46" font-weight="700" fill="#0F172A">Many small commits, one PR per tracer bullet, one squash commit on main</text><path d="M80 700 H1840" stroke="#334155" stroke-width="6" fill="none"/><text x="80" y="682" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">main</text><path data-arrow="[[190,700],[190,390],[930,390]]" d="M190 700 L190 402 Q190 390 202 390 L922 390" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#h334155)"/><circle cx="270" cy="390" r="15" fill="#334155"/><text x="270" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">test</text><circle cx="370" cy="390" r="15" fill="#334155"/><text x="370" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">feat</text><circle cx="480" cy="390" r="15" fill="#334155"/><text x="480" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">refactor</text><circle cx="600" cy="390" r="15" fill="#334155"/><text x="600" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">test</text><circle cx="700" cy="390" r="15" fill="#334155"/><text x="700" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">fix</text><circle cx="810" cy="390" r="15" fill="#334155"/><text x="810" y="360" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">docs</text><path d="M235 320 V306 H535 V320" fill="none" stroke="#64748B" stroke-width="2.5"/><text x="385" y="294" font-size="26" font-weight="700" fill="#475569" text-anchor="middle">Task 1</text><path d="M565 320 V306 H850 V320" fill="none" stroke="#64748B" stroke-width="2.5"/><text x="707.5" y="294" font-size="26" font-weight="700" fill="#475569" text-anchor="middle">Task 2</text><path d="M235 240 V226 H850 V240" fill="none" stroke="#64748B" stroke-width="2.5"/><text x="542.5" y="214" font-size="26" font-weight="700" fill="#475569" text-anchor="middle">One publish unit: a tracer bullet by default</text><text x="525" y="446" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">pb checkpoint commits locally: cheap, revertible</text><g data-box="enforce"><rect x="930" y="340" width="240" height="100" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1050" y="383.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">G:publish</text><text x="1050" y="415.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">binds to HEAD SHA</text></g><path data-arrow="[[1170,390],[1230,390]]" d="M1170 390 L1222 390" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#h334155)"/><g data-box="code"><rect x="1230" y="330" width="260" height="120" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="1360" y="367.4" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle">pb publish</text><text x="1360" y="399.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">pushes, opens the PR</text><text x="1360" y="431.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">draft under auto</text></g><path data-arrow="[[1490,390],[1550,390]]" d="M1490 390 L1542 390" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#h334155)"/><g data-box="human"><rect x="1550" y="330" width="290" height="120" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="1695" y="383.4" font-size="26" font-weight="700" fill="#78350F" text-anchor="middle">Human</text><text x="1695" y="415.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">reviews, squash-merges</text></g><path data-arrow="[[1695,450],[1695,680]]" d="M1695 450 L1695 672" fill="none" stroke="#B45309" stroke-width="4" marker-end="url(#hB45309)"/><circle cx="1695" cy="700" r="20" fill="#334155"/><text x="1675" y="630" font-size="26" font-weight="700" fill="#0F172A" text-anchor="end">PR description becomes</text><text x="1675" y="664" font-size="26" font-weight="700" fill="#0F172A" text-anchor="end">the commit message on main</text><path data-arrow="[[640,700],[640,590],[1040,590]]" d="M640 700 L640 602 Q640 590 652 590 L1032 590" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#h334155)"/><circle cx="740" cy="590" r="13" fill="#334155"/><circle cx="840" cy="590" r="13" fill="#334155"/><circle cx="940" cy="590" r="13" fill="#334155"/><text x="660" y="558" font-size="26" font-weight="700" fill="#475569" text-anchor="start">Next unit: its own branch, its own PR</text><g data-box="state"><rect x="80" y="765" width="420" height="180" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="290" y="831.1" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Never</text><text x="290" y="865.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">Pairing Buddy never merges</text><text x="290" y="899.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">and never force-pushes</text></g><g data-box="state"><rect x="526.6" y="765" width="420" height="180" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="736.6" y="831.1" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">A stop</text><text x="736.6" y="865.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">pushes nothing;</text><text x="736.6" y="899.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">commits stay local</text></g><g data-box="state"><rect x="973.2" y="765" width="420" height="180" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1183.2" y="831.1" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Stacking</text><text x="1183.2" y="865.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">only on a real code</text><text x="1183.2" y="899.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">dependency, depth cap 3</text></g><g data-box="state"><rect x="1419.8000000000002" y="765" width="420" height="180" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1629.8000000000002" y="831.1" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Otherwise</text><text x="1629.8000000000002" y="865.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">branch from the base,</text><text x="1629.8000000000002" y="899.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">even with PRs open</text></g><g data-legend="1"><rect x="80" y="985" width="30" height="30" rx="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="120" y="1009" font-size="24" fill="#0F172A">Enforces: can refuse</text></g><g data-legend="1"><rect x="388" y="985" width="30" height="30" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="428" y="1009" font-size="24" fill="#0F172A">Deterministic code</text></g><g data-legend="1"><rect x="673.2" y="985" width="30" height="30" rx="7" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="713.2" y="1009" font-size="24" fill="#0F172A">Human</text></g><g data-legend="1"><rect x="810.2" y="985" width="30" height="30" rx="7" fill="#334155" stroke="#334155" stroke-width="2.5"/><text x="850.2" y="1009" font-size="24" fill="#0F172A">Commit</text></g><text x="80" y="1055" font-size="23" fill="#475569">Planned: pb checkpoint at T1c, pb publish at T3b, auto draft publish from T5c. Target design, not built yet.</text></svg>
