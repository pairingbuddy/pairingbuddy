<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="h475569" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text data-title="1" x="80" y="96" font-size="46" font-weight="700" fill="#0F172A">Deterministic means control flow: these gaps stay open, and the plan says so</text><text x="100" y="176" font-size="28" font-weight="700" fill="#475569" text-anchor="start">Surface</text><text x="450" y="176" font-size="28" font-weight="700" fill="#881337" text-anchor="start">What holds</text><text x="1150" y="176" font-size="28" font-weight="700" fill="#475569" text-anchor="start">What still gets through</text><g data-box="state"><rect x="80" y="194" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="260.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Publishing</text></g><g data-box="enforce"><rect x="430" y="194" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="260.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">gate.mjs parses git push and gh pr forms</text></g><g data-box="plain"><rect x="1130" y="194" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="243.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Alias, script file, python -c, gh api. Only server</text><text x="1150" y="277.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">branch protection truly guards main</text></g><g data-box="state"><rect x="80" y="318" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="384.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Run state</text></g><g data-box="enforce"><rect x="430" y="318" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="384.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Write and Edit denied; SHA catches accidents</text></g><g data-box="plain"><rect x="1130" y="318" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="367.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">sed through Bash can edit it; the SHA is</text><text x="1150" y="401.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">recomputable; deleting run/ lifts the denies</text></g><g data-box="state"><rect x="80" y="442" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="508.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Commits</text></g><g data-box="enforce"><rect x="430" y="442" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="508.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Subagents denied; commits go through the CLI</text></g><g data-box="plain"><rect x="1130" y="442" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="491.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Main context may commit: listed at the</text><text x="1150" y="525.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">gate, not blocked</text></g><g data-box="state"><rect x="80" y="566" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="632.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Skipping workflows</text></g><g data-box="enforce"><rect x="430" y="566" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="632.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Plain agents leave no record: stage finish refuses</text></g><g data-box="plain"><rect x="1130" y="566" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="615.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Main context can write code with no ledger;</text><text x="1150" y="649.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">only the skill counters it</text></g><g data-box="state"><rect x="80" y="690" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="756.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Hooks off</text></g><g data-box="enforce"><rect x="430" y="690" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="756.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">pb stage finish and pb publish detect, if called</text></g><g data-box="plain"><rect x="1130" y="690" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="739.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">disableAllHooks or a hook drop-out</text><text x="1150" y="773.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">removes all enforcement</text></g><g data-box="state"><rect x="80" y="814" width="340" height="114" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="100" y="880.7" font-size="27" font-weight="700" fill="#1E293B" text-anchor="start">Quality of work</text></g><g data-box="enforce"><rect x="430" y="814" width="690" height="114" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="450" y="880.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Exit codes recorded by the CLI</text></g><g data-box="plain"><rect x="1130" y="814" width="710" height="114" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="1150" y="863.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">A green exit says tests passed,</text><text x="1150" y="897.4" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">not that they are good</text></g><text x="80" y="1055" font-size="23" fill="#475569">Plan section 8, “What stays bypassable”. Human ! commands sit outside the hooks by intent.</text></svg>
