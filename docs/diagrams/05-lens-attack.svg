<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="h475569" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" markerUnits="strokeWidth" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text data-title="1" x="80" y="96" font-size="46" font-weight="700" fill="#0F172A">Lenses attack the work, refuters attack the lenses, survivors get fixed</text><g data-box="code"><rect x="80" y="247" width="230" height="240" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="195" y="328.4" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle">pb snapshot</text><text x="195" y="360.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">subject.diff</text><text x="195" y="392.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">changed.json</text><text x="195" y="424.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">corpus.json</text></g><text x="370" y="200" font-size="24" font-weight="700" fill="#4C1D95" text-anchor="start">parallel lenses</text><g data-box="model"><rect x="370" y="215" width="210" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="475" y="253.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">lens A</text><text x="475" y="285.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="model"><rect x="370" y="320" width="210" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="475" y="358.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">lens B</text><text x="475" y="390.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="model"><rect x="370" y="425" width="210" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="475" y="463.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">lens N</text><text x="475" y="495.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="code"><rect x="650" y="247" width="230" height="240" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="765" y="328.4" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle">Merge</text><text x="765" y="360.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">ranks by severity</text><text x="765" y="392.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">empty rule cannot</text><text x="765" y="424.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">block</text></g><text x="950" y="200" font-size="24" font-weight="700" fill="#4C1D95" text-anchor="start">refuter per top finding</text><g data-box="model"><rect x="950" y="215" width="230" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1065" y="253.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">refuter 1</text><text x="1065" y="285.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="model"><rect x="950" y="320" width="230" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1065" y="358.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">refuter 2</text><text x="1065" y="390.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="model"><rect x="950" y="425" width="230" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1065" y="463.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">refuter 3</text><text x="1065" y="495.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">read-only</text></g><g data-box="state"><rect x="1260" y="215" width="260" height="90" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1390" y="253.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">survivors</text><text x="1390" y="285.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">confirmed, get fixed</text></g><g data-box="state"><rect x="1260" y="320" width="260" height="90" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1390" y="358.4" font-size="26" font-weight="700" fill="#1E293B" text-anchor="middle">refuted</text><text x="1390" y="390.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">dropped</text></g><g data-box="enforce"><rect x="1260" y="540" width="260" height="90" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1390" y="578.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">unrefuted</text><text x="1390" y="610.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">past maxRefuters</text></g><g data-box="enforce"><rect x="1260" y="650" width="260" height="90" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1390" y="688.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">uncovered</text><text x="1390" y="720.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">lens null or no corpus</text></g><g data-box="model"><rect x="1590" y="215" width="250" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1715" y="253.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">fix agent</text><text x="1715" y="285.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">one group at a time</text></g><g data-box="model"><rect x="1590" y="345" width="250" height="90" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="1715" y="383.4" font-size="26" font-weight="700" fill="#4C1D95" text-anchor="middle">course checker</text><text x="1715" y="415.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">better: keep it</text></g><g data-box="enforce"><rect x="1590" y="475" width="250" height="90" rx="14" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="1715" y="513.4" font-size="26" font-weight="700" fill="#881337" text-anchor="middle">roll back, retry</text><text x="1715" y="545.6" font-size="24" font-weight="400" fill="#0F172A" text-anchor="middle">cap 5 per stage</text></g><path data-arrow="[[310,365],[340,365]]" d="M310 365 L340 365" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[340,260],[340,470]]" d="M340 260 L340 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[340,260],[370,260]]" d="M340 260 L362 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[340,365],[370,365]]" d="M340 365 L362 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[340,470],[370,470]]" d="M340 470 L362 470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[615,260],[615,470]]" d="M615 260 L615 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[580,260],[615,260]]" d="M580 260 L615 260" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[580,365],[615,365]]" d="M580 365 L615 365" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[580,470],[615,470]]" d="M580 470 L615 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[615,365],[650,365]]" d="M615 365 L642 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[880,365],[915,365]]" d="M880 365 L915 365" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[915,260],[915,470]]" d="M915 260 L915 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[915,260],[950,260]]" d="M915 260 L942 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[915,365],[950,365]]" d="M915 365 L942 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[915,470],[950,470]]" d="M915 470 L942 470" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1180,260],[1220,260]]" d="M1180 260 L1220 260" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[1180,365],[1220,365]]" d="M1180 365 L1220 365" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[1180,470],[1220,470]]" d="M1180 470 L1220 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[1220,260],[1220,470]]" d="M1220 260 L1220 470" fill="none" stroke="#475569" stroke-width="3"/><path data-arrow="[[1220,260],[1260,260]]" d="M1220 260 L1252 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1220,365],[1260,365]]" d="M1220 365 L1252 365" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1520,260],[1590,260]]" d="M1520 260 L1582 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[765,487],[765,585],[1260,585]]" d="M765 487 L765 573 Q765 585 777 585 L1252 585" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1010" y="572" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">lower-ranked findings skip refuters</text><path data-arrow="[[475,515],[475,695],[1260,695]]" d="M475 515 L475 683 Q475 695 487 695 L1252 695" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="870" y="682" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">a failed lens or an empty corpus</text><path data-arrow="[[1715,305],[1715,345]]" d="M1715 305 L1715 337" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><path data-arrow="[[1715,435],[1715,475]]" d="M1715 435 L1715 467" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><text x="1700" y="463" font-size="22" font-weight="400" fill="#475569" text-anchor="end">bad verdict</text><path data-arrow="[[1840,520],[1875,520],[1875,260],[1840,260]]" d="M1840 520 L1863 520 Q1875 520 1875 508 L1875 272 Q1875 260 1863 260 L1848 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#h475569)"/><g data-box="state"><rect x="80" y="785" width="420" height="165" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="290" y="843.6" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Read-only by definition</text><text x="290" y="877.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">tools: Read, Grep, Glob</text><text x="290" y="911.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">no Bash, Write or Edit</text></g><g data-box="state"><rect x="526.6" y="785" width="420" height="165" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="736.6" y="843.6" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Hard caps</text><text x="736.6" y="877.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">maxRefuters, maxAgents,</text><text x="736.6" y="911.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">maxFindingsPerLens</text></g><g data-box="state"><rect x="973.2" y="785" width="420" height="165" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1183.2" y="843.6" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">No repeated mistakes</text><text x="1183.2" y="877.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">a repeat must change approach</text><text x="1183.2" y="911.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">only the cap stops the loop</text></g><g data-box="state"><rect x="1419.8000000000002" y="785" width="420" height="165" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="1629.8000000000002" y="843.6" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Why the caps exist</text><text x="1629.8000000000002" y="877.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">review run: 41 agents against</text><text x="1629.8000000000002" y="911.9" font-size="26" font-weight="400" fill="#0F172A" text-anchor="middle">8-15 expected, 3.1M tokens</text></g><g data-legend="1"><rect x="80" y="985" width="30" height="30" rx="7" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/><text x="120" y="1009" font-size="24" fill="#0F172A">Model</text></g><g data-legend="1"><rect x="217" y="985" width="30" height="30" rx="7" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/><text x="257" y="1009" font-size="24" fill="#0F172A">Deterministic code</text></g><g data-legend="1"><rect x="502.20000000000005" y="985" width="30" height="30" rx="7" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/><text x="542.2" y="1009" font-size="24" fill="#0F172A">Files and state</text></g><g data-legend="1"><rect x="753.2" y="985" width="30" height="30" rx="7" fill="#FFE4E6" stroke="#BE123C" stroke-width="2.5"/><text x="793.2" y="1009" font-size="24" fill="#0F172A">Can stop the run or the report</text></g><text x="80" y="1055" font-size="23" fill="#475569">Planned for T5; nothing here is built yet. Numbers are initial and U9 tunes them from measured spend.</text></svg>
